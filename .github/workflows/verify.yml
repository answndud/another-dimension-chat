name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lightweight verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/server/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web --workspaces=false

      - name: Install relay dependencies
        run: npm ci --prefix apps/server --workspaces=false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify current daemon/web/relay product
        run: CARGO_BUILD_JOBS=2 scripts/verify_full.sh
