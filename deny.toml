# cargo-deny policy mirror. The repository also runs the dependency policy
# script so local verification does not require downloading cargo-deny.

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "reqwest" }
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib"
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
