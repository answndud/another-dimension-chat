[package]
name = "another-dimension-daemon"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Local OpenMLS security daemon for Another Dimension"

[lib]
path = "src/lib.rs"

[[bin]]
name = "another-dimension-daemon"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio", "ws"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
hyper = { version = "1.11.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
getrandom = "0.4.2"
openmls = { version = "=0.8.1", default-features = false }
openmls_libcrux_crypto = { version = "=0.3.1", default-features = false }
openmls_traits = { version = "=0.5.0", default-features = false }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
sha1 = "0.10.6"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12"] }
tls_codec = "0.4.2"
webpki-roots = "0.26.11"
zeroize = "1.8.2"

keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }

[lints]
workspace = true
