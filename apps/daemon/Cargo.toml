[package]
name = "another-dimension-daemon"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Local security daemon boundary for Another Dimension (implementation in progress)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "another-dimension-daemon"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.2"
openmls = { version = "=0.8.1", default-features = false, features = ["libcrux-provider"] }
openmls_libcrux_crypto = "=0.3.1"
openmls_traits = "=0.5.0"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12"] }
tls_codec = "0.4.2"
webpki-roots = "0.26.11"
zeroize = "1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", default-features = false }

[lints]
workspace = true
