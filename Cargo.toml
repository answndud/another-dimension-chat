[workspace]
# This workspace still contains legacy/native prototype crates. The current
# product path is apps/web + apps/server + crates/web-crypto-wasm; do not use a
# full workspace build as current web product evidence.
members = [
    "crates/identity",
    "crates/pairing",
    "crates/crypto",
    "crates/protocol",
    "crates/transport",
    "crates/storage",
    "crates/core",
    "crates/web-crypto-wasm",
    "apps/engine",
    "apps/cli",
]
exclude = [
    "apps/desktop-tauri/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
incremental = false
debug = 1
strip = "symbols"
panic = "abort"
codegen-units = 1
