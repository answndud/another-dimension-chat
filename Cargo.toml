[workspace]
members = [
    "apps/daemon",
    "apps/tools",
    "apps/relay",
]
resolver = "2"

[profile.dev]
incremental = false
debug = 0

[profile.test]
incremental = false
debug = 0

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
incremental = false
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
